<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0057a8"/>
      <stop offset="100%" style="stop-color:#00b4d8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="16" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#00e5ff" stroke-width="0.3" opacity="0.15">
    <line x1="25" y1="0" x2="25" y2="100"/>
    <line x1="50" y1="0" x2="50" y2="100"/>
    <line x1="75" y1="0" x2="75" y2="100"/>
    <line x1="0" y1="25" x2="100" y2="25"/>
    <line x1="0" y1="50" x2="100" y2="50"/>
    <line x1="0" y1="75" x2="100" y2="75"/>
  </g>

  <!-- Corner brackets -->
  <g stroke="#00e5ff" stroke-width="2.5" fill="none" opacity="0.9" filter="url(#glow)">
    <polyline points="8,20 8,8 20,8"/>
    <polyline points="80,8 92,8 92,20"/>
    <polyline points="8,80 8,92 20,92"/>
    <polyline points="80,92 92,92 92,80"/>
  </g>

  <!-- Hexagon -->
  <polygon points="50,18 68,28 68,52 50,62 32,52 32,28"
    fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.5"/>

  <!-- Play triangle -->
  <polygon points="42,34 42,56 63,45" fill="url(#btn)" filter="url(#glow)"/>

  <!-- Bottom text -->
  <text x="50" y="80" text-anchor="middle"
    font-family="Courier New, monospace" font-size="7"
    fill="#00e5ff" letter-spacing="2" opacity="0.85">QUESTA</text>
  <text x="50" y="89" text-anchor="middle"
    font-family="Courier New, monospace" font-size="5"
    fill="#446688" letter-spacing="1.5">LAUNCHER</text>
</svg>
